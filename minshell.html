<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raylib Game Arcade</title>
    <style>
        body { 
            margin: 0; padding: 0; background-color: #111; color: #fff;
            font-family: sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh;
            overflow: hidden;
        }

        /* --- Canvas & Spinner --- */
        #canvas {
            border-radius: 4px;
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
            image-rendering: pixelated;
            max-width: 100%; max-height: 100%;
        }
        .spinner {
            height: 30px; width: 30px; margin: 0px auto;
            animation: rotation 0.6s linear infinite;
            border-left: 6px solid rgba(0, 174, 239, 0.15);
            border-right: 6px solid rgba(0, 174, 239, 0.15);
            border-bottom: 6px solid rgba(0, 174, 239, 0.15);
            border-top: 6px solid rgba(0, 174, 239, 0.8);
            border-radius: 100%;
            position: absolute; top: 50%; left: 50%;
            margin-top: -15px; margin-left: -15px; z-index: 999;
        }
        @keyframes rotation { from {transform: rotate(0deg);} to {transform: rotate(359deg);} }
    </style>
  </head>
  <body>
    <div class="spinner" id='spinner'></div>
    
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    
    <script type='text/javascript'>
      var Module = {
        print: (function() { return function(text) { console.log(text); }; })(),
        canvas: document.getElementById('canvas'),
        setStatus: function(text) { if (!text) return; console.log("Status: " + text); },
        onRuntimeInitialized: function() {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('canvas').focus();
        }
      };

      // Prevent backspace from navigating away from the page
      document.addEventListener('keydown', function(event) {
        if (event.key === 'Backspace' || event.keyCode === 8) {
            const target = event.target;
            const tagName = target.tagName;
            if (tagName !== 'INPUT' && tagName !== 'TEXTAREA' && !target.isContentEditable) {
                event.preventDefault();
            }
        }
      }, true); 

      // Dummy functions to prevent C++ calls from breaking if the game still tries to trigger them
      window.updateLeaderboard = function(score) { console.log("Score reached:", score); };
      window.refreshLeaderboard = function() { };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
